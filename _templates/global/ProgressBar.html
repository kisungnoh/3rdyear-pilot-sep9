    max-width: 960px;
    margin: 4px auto 16px;
}
.instructions-progress-label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-align: right;
    margin-bottom: 4px;
}
.instructions-progress-track {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
}

        <div class="instructions-progress-fill" style="width: {{ progress_pct }}%;"></div>
