{{ extends "global/Page.html" }}
{{ block title }}Comprehension Check{{ endblock }}

{{ block content }}
<br>
<p style="font-size:12px; color:#6b7280; margin-bottom:20px;">Question 7 of 7</p>
{{ formfield 'comprehension_q7' }}
{{ form.comprehension_q7_fail }}
<div id="cq-error" style="display:none; color:#c62828; background:#fff3e0; border:1px solid #e65100; border-radius:6px; padding:8px 14px; margin-bottom:8px;"></div>
<div style="text-align:center; padding-top:20px;">{{ next_button }}</div>

{{ include 'bank2_instruction_70nd/Reminder.html' }}

<script>
document.addEventListener("DOMContentLoaded", function () {
    const nextButton = document.querySelector(".otree-btn-next");
    const err = document.getElementById("cq-error");
    const failInput = document.querySelector('input[name="comprehension_q7_fail"]');

    nextButton.addEventListener("click", function (e) {

        const sel = document.querySelector('input[name="comprehension_q7"]:checked');

        if (!sel) {
            e.preventDefault();
            err.textContent = "Please select an answer.";
            err.style.display = "block";
            return;
        }

        if (sel.value !== "new") {
            failInput.value = "1";
            e.preventDefault();
            err.textContent = "Incorrect.";
            err.style.display = "block";
            return;
        }

        err.style.display = "none";
    });
});
</script>
{{ endblock }}
